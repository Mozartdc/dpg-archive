name: 배포 무결성 검사

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-production-build:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 의존성 설치
        run: npm ci

      - name: 이미지 경로 회귀 테스트
        run: npm run test:image-paths

      - name: 프로덕션 빌드 및 이미지 무결성 검사
        run: npm run build
